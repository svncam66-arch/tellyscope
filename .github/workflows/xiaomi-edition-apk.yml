name: Tellyscope RU Xiaomi APK
on:
  workflow_dispatch:
  push:
    branches:
      - xiaomi-edition
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build signed debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Tellyscope-RU-Xiaomi-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          apk="Tellyscope-RU-Xiaomi-Edition-0.7.0-ru.1.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          if gh release view "v0.7.0-ru.1" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v0.7.0-ru.1" "$apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v0.7.0-ru.1" "$apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Tellyscope RU — Xiaomi Edition 0.7.0-ru.1" \
              --notes "Тестовая русскоязычная сборка на основе Tellyscope 0.7.0. Не все экраны переведены; безопасность системных пакетов требует проверки на конкретной модели. APK подписан отладочным ключом для тестирования." \
              --prerelease
          fi
